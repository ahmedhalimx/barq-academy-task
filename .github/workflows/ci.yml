name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          PUBLIC_PORT=8080
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax & Compose Config Check
        run: docker compose config -q

      - name: Build Images
        run: docker compose -p barq-assessment build

      - name: Start Services
        run: docker compose -p barq-assessment up -d
        env:
                DATABASE_URL: postgresql://barq_app:test_password@postgres:5432/barq_tasks
    REDIS_URL: ${{ secrets.REDIS_URL }} 


      - name: Wait for Service Readiness (/ready)
        run: |
          echo "Waiting for http://localhost:8080/ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/ready > /dev/null; then
              echo "Service is ready!"
              exit 0
            fi
            echo "Waiting for services to become ready ($i/30)..."
            sleep 2
          done
          echo "Service readiness poll timed out!" >&2
          exit 1

      - name: Run Validation Suite
        run: python validate.py

      - name: Teardown Services
        if: always()
        run: docker compose -p barq-assessment down -v
