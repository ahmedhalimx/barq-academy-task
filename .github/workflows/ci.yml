name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          PUBLIC_PORT=8080
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax & Compose Config Check
        run: docker compose config -q

      - name: Build Images
        run: docker compose -p barq-assessment build

      - name: Start Services
        run: docker compose -p barq-assessment up -d
        env:
            DATABASE_URL: postgresql://barq_app:test_password@postgres:5432/barq_tasks
            REDIS_URL: ${{ secrets.REDIS_URL }} 

      - name: Run Validation Suite
        run: python validate.py

      - name: Teardown Services
        if: always()
        run: docker compose -p barq-assessment down -v
